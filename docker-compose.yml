name: crm-rentacar

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: runtime
      args:
        INSTALL_DEV: "true"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      target: runtime
      args:
        INSTALL_DEV: "true"
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "--concurrency", "2"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Tareas programadas: recordatorios de recogida, reintentos de SES.Hospedajes
  # y avisos de mantenimiento. Uno solo: dos beat duplicarian cada envio.
  beat:
    build:
      context: .
      target: runtime
      args:
        INSTALL_DEV: "true"
    command: ["celery", "-A", "config", "beat", "-l", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  tailwind:
    image: node:22-bookworm-slim
    working_dir: /app
    # Mismo uid que el usuario del contenedor web: los assets generados en el
    # bind mount quedan del usuario del host, no de root.
    user: "1000:1000"
    command: sh -c "npm install --no-audit --no-fund && npm run watch"
    volumes:
      - .:/app
    environment:
      npm_config_cache: /tmp/.npm
    profiles: ["dev"]

volumes:
  pgdata:
  redisdata:
  staticfiles:
