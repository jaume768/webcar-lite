{% load i18n static %}<!DOCTYPE html>
{% get_current_language as idioma %}
<html lang="{{ idioma }}" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{{ empresa.display_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="flex min-h-full items-center justify-center bg-canvas px-4 py-10">
  <main class="w-full max-w-md">
    <div class="mb-6 flex justify-center">
      {% if logo_url %}<img src="{{ logo_url }}" alt="{{ empresa.display_name }}" class="max-h-12 max-w-48 object-contain">
      {% else %}<span class="text-xl font-bold text-brand-950">{{ empresa.display_name }}</span>{% endif %}
    </div>
    <div class="card p-6 sm:p-8">{% block content %}{% endblock %}</div>
    <p class="mt-6 text-center text-xs text-slate-400">{{ empresa.legal_name }} · {{ empresa.tax_id }}</p>
  </main>
</body>
</html>
