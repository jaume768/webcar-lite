{% extends "billing/public/base.html" %}
{% load i18n %}

{% block content %}
  <p class="text-center text-sm text-slate-600">{% translate "Te llevamos a la página segura del banco..." %}</p>
  <form id="ir-al-banco" method="post" action="{{ action }}" class="mt-6">
    {% for nombre, valor in fields.items %}<input type="hidden" name="{{ nombre }}" value="{{ valor }}">{% endfor %}
    <button type="submit" class="btn-primary w-full">{% translate "Continuar al pago" %}</button>
  </form>
  <script>document.getElementById("ir-al-banco").submit();</script>
{% endblock %}
