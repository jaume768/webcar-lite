{% load i18n %}
{% translate "Sin resultados" as titulo_defecto %}
{% translate "Prueba a cambiar la busqueda o los filtros." as mensaje_defecto %}
<div class="flex flex-col items-center justify-center px-4 py-12 text-center">
  <svg class="size-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"
       stroke-width="1.5" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round"
          d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11v6m4-6v6m4.5-9.75H5.5"/>
  </svg>
  <p class="mt-3 text-sm font-medium text-slate-700">
    {{ empty_title|default:titulo_defecto }}
  </p>
  <p class="mt-1 text-sm text-slate-500">
    {{ empty_message|default:mensaje_defecto }}
  </p>
</div>
