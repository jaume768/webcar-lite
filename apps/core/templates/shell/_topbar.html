{% load i18n %}
<header class="sticky top-0 z-20 flex h-14 items-center gap-3 border-b border-line
               bg-surface/95 px-4 backdrop-blur sm:px-6">

  <button type="button" class="btn-ghost p-2 lg:hidden" @click="sidebarAbierta = true"
          aria-label="{% translate 'Abrir navegacion' %}">
    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
         aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round"
         d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
  </button>

  {% include "shell/_office_selector.html" %}

  <div class="ml-auto flex items-center gap-2">
    {# Indicador global de peticion HTMX en curso. #}
    <span class="htmx-indicator text-xs text-slate-500" aria-live="polite">
      {% translate "Cargando..." %}
    </span>

    {% if user.is_authenticated %}
      <div class="relative" x-data="{ abierto: false }" @keydown.escape.window="abierto = false">
        <button type="button" class="btn-ghost gap-2" @click="abierto = !abierto"
                :aria-expanded="abierto" aria-haspopup="menu">
          <span class="flex size-7 items-center justify-center rounded-full bg-brand-100
                       text-xs font-semibold text-brand-700">
            {{ user.get_username|slice:":2"|upper }}
          </span>
          <span class="hidden text-sm sm:inline">{{ user.get_username }}</span>
        </button>
        <div x-show="abierto" x-cloak x-transition @click.outside="abierto = false"
             role="menu"
             class="absolute right-0 mt-1 w-48 overflow-hidden rounded-lg border border-line
                    bg-surface py-1 shadow-lg">
          <span class="block px-3 py-2 text-xs text-slate-500">{{ user.email|default:"" }}</span>
        </div>
      </div>
    {% else %}
      <span class="text-sm text-slate-500">{% translate "Sin sesion iniciada" %}</span>
    {% endif %}
  </div>
</header>
