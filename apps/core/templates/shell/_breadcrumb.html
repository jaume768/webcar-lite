{% load i18n %}
{% if breadcrumbs %}
  <nav aria-label="{% translate 'Migas de pan' %}" class="mb-4">
    <ol class="flex flex-wrap items-center gap-1 text-sm text-slate-500">
      {% for crumb in breadcrumbs %}
        <li class="flex items-center gap-1">
          {% if not forloop.first %}
            <svg class="size-4 text-slate-300" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
            </svg>
          {% endif %}
          {% if crumb.url and not forloop.last %}
            <a href="{{ crumb.url }}" class="rounded hover:text-brand-700 hover:underline">
              {{ crumb.label }}
            </a>
          {% else %}
            <span class="font-medium text-slate-700" aria-current="page">{{ crumb.label }}</span>
          {% endif %}
        </li>
      {% endfor %}
    </ol>
  </nav>
{% endif %}
