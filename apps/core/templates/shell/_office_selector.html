{% load i18n %}
{% comment %} Oficina activa. Se reemplaza a si mismo al cambiar; el backend valida que la
   oficina elegida este entre las permitidas. {% endcomment %}
<div id="selector-oficina" class="flex items-center">
  {% if available_offices %}
    <label for="office-id" class="sr-only">{% translate "Oficina activa" %}</label>
    <div class="relative">
      <svg class="pointer-events-none absolute top-1/2 left-3 size-5 -translate-y-1/2 text-brand-600"
           viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M11.54 22.35a.75.75 0 00.92 0C14.2 21 19.5 16.4 19.5 10.5a7.5 7.5 0 00-15 0c0 5.9 5.3 10.5 7.04 11.85zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
      </svg>
      <select id="office-id" name="office_id"
              class="block max-w-44 appearance-none truncate rounded-xl border border-line bg-surface py-2.5 pr-9 pl-10
                     text-sm font-semibold text-slate-900 shadow-sm focus:border-brand-500 focus:ring-2
                     focus:ring-brand-500/20 focus:outline-none sm:max-w-none"
              hx-post="{% url 'core:set_active_office' %}"
              hx-target="#selector-oficina"
              hx-swap="outerHTML">
        {% for office in available_offices %}
          <option value="{{ office.id }}"
                  {% if active_office and office.id == active_office.id %}selected{% endif %}>
            {{ office.name }}
          </option>
        {% endfor %}
      </select>
      <svg class="pointer-events-none absolute top-1/2 right-3 size-4 -translate-y-1/2 text-slate-500"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
      </svg>
    </div>
  {% else %}
    <span class="rounded-xl bg-slate-100 px-3 py-2 text-xs font-medium text-slate-500">
      {% translate "Sin oficinas asignadas" %}
    </span>
  {% endif %}
</div>
