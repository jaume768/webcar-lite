[project]
name = "crm-rentacar"
version = "0.1.0"
description = "CRM de alquiler de vehiculos sin conductor (Espana)"
requires-python = ">=3.12,<3.13"

dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<3.3",
    "django-environ>=0.12,<0.13",
    "structlog>=25.1,<26.0",
    "django-structlog>=9.0,<10.0",
    "celery>=5.5,<5.6",
    "redis>=5.2,<7.0",
    "django-htmx>=1.23,<2.0",
    "django-template-partials>=24.4,<26.0",
    "django-axes[ipware]>=7.0,<9.0",
    "django-filter>=24.0,<26.0",
    "Pillow>=11.0,<13.0",
    "weasyprint>=65.0,<67.0",
    # QR de Verifactu en la factura. Python puro, sin dependencias.
    "segno>=1.6,<2.0",
    # Firma 3DES + HMAC-SHA256 de las notificaciones de Redsys.
    "cryptography>=44.0,<47.0",
    "whitenoise[brotli]>=6.9,<7.0",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<0.14",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.11,<5.0",
    "pytest-cov>=6.0,<8.0",
    "coverage>=7.6,<8.0",
    "factory-boy>=3.3,<4.0",
    "django-debug-toolbar>=5.0,<6.0",
    # Para mirar dentro de los PDF que genera el contrato.
    "pypdf>=5.0,<7.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # bugbear
    "DJ",                # flake8-django
    "C4",                # comprehensions
    "SIM",               # simplify
    "RUF",
]
ignore = [
    "RUF012",  # Django usa atributos de clase mutables por convencion
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# --ds tiene prioridad sobre la variable de entorno del contenedor, que
# apunta a los ajustes de desarrollo.
# -m "not slow": los tests de volumen (50.000 clientes) no entran en el ciclo
# normal. Se piden a proposito con `make test ARGS="-m slow"`.
addopts = "--ds=config.settings.test --strict-markers --reuse-db -q -m 'not slow'"
testpaths = ["apps", "tests"]
markers = [
    "slow: test de volumen o de rendimiento. Se ejecuta con -m slow.",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
